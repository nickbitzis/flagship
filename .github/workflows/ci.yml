name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check .
      - name: Test
        run: uv run --python 3.12 --group dev pytest -q
      - name: Benchmark
        run: uv run --python 3.12 flagship bench -n 100000 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stale flag scan
        run: |
          uv run --python 3.12 flagship scan examples/shop --flags examples/flags-export.json \
            --format markdown >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build --target server -t flagship:ci .
          docker build --target shop -t flagship-shop:ci .
      - name: Smoke test container
        run: |
          docker run -d --name fs -p 8788:8788 flagship:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8788/healthz && break; sleep 1; done
          curl -sf -H 'authorization: sdk-prod-demo' http://localhost:8788/sdk/ruleset | grep -q new-checkout
          curl -sf http://localhost:8788/metrics | grep flagship_flags
          docker rm -f fs
