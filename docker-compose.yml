# Flagship server plus an example storefront worker that uses the Python SDK.
#   docker compose up --build        UI on http://localhost:8788
#   docker compose stop flagship     the shop keeps serving on its last known good ruleset
#   docker compose start flagship    the shop reconnects and resyncs over SSE
services:
  flagship:
    build:
      context: .
      target: server
    ports: ["8788:8788"]
    environment:
      FLAGSHIP_ADMIN_TOKEN: ${FLAGSHIP_ADMIN_TOKEN:-}
    volumes:
      - flagship-data:/app/data
    restart: unless-stopped

  shop:
    build:
      context: .
      target: shop
    environment:
      FLAGSHIP_URL: http://flagship:8788
      FLAGSHIP_SDK_KEY: ${FLAGSHIP_SDK_KEY:-sdk-prod-demo}
      SHOP_INTERVAL: "0.5"
    volumes:
      - shop-cache:/app/data
    depends_on:
      flagship:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flagship-data:
  shop-cache:
